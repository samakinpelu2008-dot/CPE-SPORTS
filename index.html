<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fresher's Cup | Home</title>
    
    <!-- PWA Integration -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff3e3e">
    <link rel="apple-touch-icon" href="https://placehold.co/192x192/000/fff?text=FC">

    <style>
        :root {
            --bg: #000000;
            --card-bg: #111111;
            --primary: #ffffff;
            --accent: #ff3e3e;
            --border: #222222;
            --text-dim: #888888;
        }

        #loader {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        .spinner {
            width: 40px; height: 40px;
            border: 3px solid #222;
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        body {
            background-color: var(--bg);
            color: var(--primary);
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        header { padding: 30px 0 20px 0; }
        header h1 { font-weight: 900; font-size: 2.2rem; letter-spacing: -1.5px; margin: 0; text-align: center; }
        
        .container { width: 92%; max-width: 400px; }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 15px;
        }

        .timer-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            font-weight: 800;
            color: var(--accent);
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .live-dot {
            width: 8px; height: 8px;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent);
            animation: blink 1.5s infinite;
        }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        .match-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            align-items: center;
            text-align: center;
            margin-bottom: 20px;
        }

        .mini-logo { width: 60px; height: 60px; object-fit: contain; margin-bottom: 8px; border-radius: 50%; background: #1a1a1a; }
        .team-name { font-size: 0.85rem; font-weight: 900; display: block; }
        .score-center { font-size: 2.8rem; font-weight: 900; letter-spacing: -2px; }

        .cta-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: var(--primary);
            color: #000;
            text-decoration: none;
            font-weight: 900;
            font-size: 0.9rem;
            height: 50px;
            border-radius: 12px;
            transition: transform 0.2s active;
        }

        .cta-button:active { transform: scale(0.98); }

        .chat-preview-box { height: 200px; display: flex; flex-direction: column; }
        .message-list { flex-grow: 1; overflow-y: hidden; font-size: 0.85rem; }
        .msg { margin-bottom: 10px; border-left: 3px solid var(--accent); padding-left: 10px; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .msg .user { font-weight: 800; color: var(--text-dim); font-size: 0.75rem; display: block; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <div style="font-weight: 900; font-size: 0.7rem; letter-spacing: 2px; color: white;">INITIALIZING APP...</div>
    </div>

    <header>
        <h1>FRESHER'S CUP</h1>
    </header>

    <main class="container">
        <!-- Live Score Card -->
        <section class="card">
            <div class="timer-row">
                <span class="live-dot"></span>
                <span id="match-timer">00:00</span>
            </div>

            <div class="match-grid">
                <div class="team">
                    <img src="images/cpe.png" class="mini-logo" alt="CPE" onerror="this.src='https://placehold.co/60x60/800/fff?text=CPE'">
                    <span class="team-name">CPE</span>
                </div>
                <div class="score-center" id="live-score">0 - 0</div>
                <div class="team">
                    <img src="images/pap.png" class="mini-logo" alt="PAP" onerror="this.src='https://placehold.co/60x60/008/fff?text=PAP'">
                    <span class="team-name">PAP</span>
                </div>
            </div>

            <a href="match.html" class="cta-button">
                <i data-lucide="play" style="width:18px; fill: currentColor;"></i>
                <span>ENTER LIVE MATCH</span>
            </a>
        </section>

        <!-- Chat Preview -->
        <section class="card chat-preview-box">
            <div style="font-size: 0.75rem; font-weight: 900; color: var(--text-dim); margin-bottom: 15px; letter-spacing: 1px;">FAN CHATTER</div>
            <div class="message-list" id="chat-preview">
                <div class="msg" style="border:none; color:#444;">Syncing messages...</div>
            </div>
        </section>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, query, limitToLast } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDozMVnewcY9Pw70jmFG7JyenpHlLjkNPM",
            authDomain: "rock-paper-scissors-e1f1c.firebaseapp.com",
            databaseURL: "https://rock-paper-scissors-e1f1c-default-rtdb.firebaseio.com",
            projectId: "rock-paper-scissors-e1f1c",
            storageBucket: "rock-paper-scissors-e1f1c.firebasestorage.app",
            messagingSenderId: "521897557787",
            appId: "1:521897557787:web:7b04c2ecebf0ea85821dbe"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        let timerInterval = null;

        // Hide Loader
        window.addEventListener('load', () => {
            setTimeout(() => { document.getElementById('loader').style.opacity = '0'; 
            setTimeout(() => { document.getElementById('loader').style.display = 'none'; }, 500); }, 800);
        });

        // Sync Score
        onValue(ref(db, 'match/score'), (snapshot) => {
            const score = snapshot.val();
            if (score) document.getElementById('live-score').innerText = score;
        });

        // Sync Timer
        onValue(ref(db, 'match/timer'), (snapshot) => {
            const data = snapshot.val();
            const display = document.getElementById('match-timer');
            if (timerInterval) clearInterval(timerInterval);

            if (data && data.state === 'running') {
                timerInterval = setInterval(() => {
                    const elapsed = Math.floor((Date.now() - data.startTime) / 1000);
                    let mins = Math.floor(elapsed / 60);
                    let secs = elapsed % 60;
                    if (mins >= data.limit) {
                        display.innerText = `${data.limit}:00 +${mins - data.limit}:${secs.toString().padStart(2, '0')}`;
                    } else {
                        display.innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
                    }
                }, 1000);
            } else {
                display.innerText = "MATCH PAUSED";
            }
        });

        // Sync Chat (Last 3 messages for preview)
        const chatRef = query(ref(db, 'messages'), limitToLast(3));
        onValue(chatRef, (snapshot) => {
            const list = document.getElementById('chat-preview');
            list.innerHTML = '';
            snapshot.forEach(child => {
                const m = child.val();
                const div = document.createElement('div');
                div.className = 'msg';
                div.innerHTML = `<span class="user">@${m.username}</span> ${m.text}`;
                list.appendChild(div);
            });
        });

        lucide.createIcons();

        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').catch(() => {});
        }
    </script>
</body>
</html>
